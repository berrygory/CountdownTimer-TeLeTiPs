<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo-intro – test</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    /* TESTSIDE for logo-animationen. Når den er godkendt, flyttes den ind i index.html. */
    @font-face { font-family: "Fraunces"; src: url("fonts/fraunces-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

    :root { --green: #1f8a63; --green-dark: #146246; --ink: #12342c; --mint: #7fd8b2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Inter", system-ui, sans-serif; background: #f5faf7; }

    /* Den rigtige hjemmeside ligger bagved, så man kan se afsløringen */
    .site-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

    /* ---------- Intro-lag ---------- */
    .intro {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      background:
        radial-gradient(40% 45% at 78% 18%, rgba(159, 227, 196, .75), transparent 70%),
        radial-gradient(45% 50% at 15% 85%, rgba(196, 239, 219, .9), transparent 70%),
        linear-gradient(180deg, #ffffff, #eef8f3);
      cursor: pointer;
    }
    .intro-card {
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 44px 56px 40px;
      border-radius: 32px;
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: saturate(1.5) blur(18px); backdrop-filter: saturate(1.5) blur(18px);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 20px 60px rgba(18, 74, 54, .14);
      opacity: 0; transform: scale(.94);
    }
    .logo { width: 132px; height: 132px; overflow: visible; color: var(--green); }
    .logo .house { fill: currentColor; fill-opacity: 0; stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1; stroke-linejoin: round; }
    .logo .chimney { fill: currentColor; transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); }
    .logo .hand { fill: currentColor; opacity: 0; transform: translateY(14px); }
    .logo .window { fill: #fff; transform-box: fill-box; transform-origin: center; transform: scale(0); }
    .logo .cross { stroke: currentColor; stroke-width: 1.6; opacity: 0; }
    .logo .spark { fill: var(--mint); transform-box: fill-box; transform-origin: center; transform: scale(0); }

    .wordmark { text-align: center; }
    .line { display: block; overflow: hidden; }
    .line span {
      display: block; font-family: "Fraunces", Georgia, serif; font-weight: 600;
      font-size: clamp(1.9rem, 1.4rem + 2vw, 2.6rem); line-height: 1.08; color: var(--ink);
      transform: translateY(105%);
    }
    .tag {
      position: relative; display: inline-block; margin-top: 12px; padding: 4px 6px;
      font-size: .8rem; font-weight: 700; letter-spacing: .6em; text-transform: uppercase; color: var(--green);
      opacity: 0;
    }
    /* Penselstrøg under "Multi Service" */
    .stroke {
      position: absolute; left: -8%; right: -8%; bottom: -10px; height: 14px; width: 116%;
      clip-path: inset(0 100% 0 0);
    }

    .skip-hint {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      font-size: .8rem; color: #557069; opacity: 0;
    }

    /* ---------- Afspilning ---------- */
    .play .intro-card { animation: card-in .6s cubic-bezier(.2, .8, .2, 1) .1s forwards; }
    .play .hand { animation: hand-in .7s cubic-bezier(.2, .8, .2, 1) .35s forwards; }
    .play .house { animation: draw .9s ease-in-out .55s forwards, fill-in .45s ease 1.35s forwards; }
    .play .chimney { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1) 1.45s forwards; }
    .play .window { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1) 1.65s forwards; }
    .play .cross { animation: fade .3s ease 1.85s forwards; }
    .play .spark { animation: spark .7s ease 1.9s forwards; }
    .play .line:nth-child(1) span { animation: rise .6s cubic-bezier(.2, .8, .2, 1) 1.7s forwards; }
    .play .line:nth-child(2) span { animation: rise .6s cubic-bezier(.2, .8, .2, 1) 1.82s forwards; }
    .play .tag { animation: track-in .7s cubic-bezier(.2, .8, .2, 1) 2.1s forwards; }
    .play .stroke { animation: paint .5s cubic-bezier(.6, 0, .3, 1) 2.45s forwards; }
    .play .skip-hint { animation: fade .4s ease 1s forwards; }
    .play.leave .intro { animation: leave .8s cubic-bezier(.7, 0, .3, 1) forwards; }
    .play.leave .intro-card { animation: card-out .8s cubic-bezier(.7, 0, .3, 1) forwards; opacity: 1; transform: none; }

    @keyframes card-in { to { opacity: 1; transform: none; } }
    @keyframes hand-in { to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fill-in { to { fill-opacity: 1; } }
    @keyframes pop { to { transform: scale(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes spark { 0% { transform: scale(0) rotate(0); } 50% { transform: scale(1.2) rotate(45deg); } 100% { transform: scale(0) rotate(90deg); } }
    @keyframes rise { to { transform: none; } }
    @keyframes track-in { to { opacity: 1; letter-spacing: .22em; } }
    @keyframes paint { to { clip-path: inset(0 0 0 0); } }
    @keyframes leave { to { opacity: 0; visibility: hidden; } }
    @keyframes card-out { to { opacity: 0; transform: translateY(-30px) scale(.96); } }

    @media (prefers-reduced-motion: reduce) {
      .play .intro-card, .play .hand, .play .house, .play .chimney, .play .window, .play .cross,
      .play .line span, .play .tag, .play .stroke { animation-duration: .01s !important; animation-delay: 0s !important; }
    }

    /* ---------- Testkontroller ---------- */
    .controls {
      position: fixed; right: 16px; bottom: 16px; z-index: 20;
      display: flex; gap: 8px; padding: 8px; border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 10px 30px rgba(18, 74, 54, .15);
      font-size: .875rem;
    }
    .controls button {
      padding: 9px 16px; border: 0; border-radius: 999px; cursor: pointer;
      font: inherit; font-weight: 600; background: var(--green); color: #fff;
    }
    .controls button.secondary { background: #e3f4ec; color: var(--green-dark); }
    .test-label {
      position: fixed; left: 16px; top: 16px; z-index: 20;
      padding: 6px 12px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .08em;
      background: #12342c; color: #fff; text-decoration: none;
    }
    @media (max-width: 480px) { .intro-card { padding: 36px 28px 32px; } .logo { width: 110px; height: 110px; } }
  </style>
</head>
<body>
  <iframe class="site-frame" src="index.html" title="Hjemmesiden" tabindex="-1"></iframe>

  <div class="stage play" id="stage">
    <div class="intro" id="intro" role="presentation">
      <div class="intro-card">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <path class="hand" d="M4 45c4-2 8-1.4 12 .6l12 5c4 1.6 8 1.2 12-.8l14-7.8c3-1.6 6 0 5.2 3-.4 1.5-1.7 2.6-3.6 3.6L40 57c-5 2.6-11 3-16.4 1L4 52z"/>
          <rect class="chimney" x="42" y="12" width="5" height="9" rx="1"/>
          <path class="house" pathLength="1" d="M32 9 53 27h-4.5v18h-33V27H11z"/>
          <rect class="window" x="27" y="27" width="10" height="10" rx="1"/>
          <path class="cross" d="M32 27v10M27 32h10"/>
          <path class="spark" d="M54 4l1.4 3.6L59 9l-3.6 1.4L54 14l-1.4-3.6L49 9l3.6-1.4z"/>
        </svg>
        <div class="wordmark">
          <span class="line"><span>Don’s Hjælp</span></span>
          <span class="line"><span>i Hverdagen</span></span>
          <span class="tag">Multi Service
            <svg class="stroke" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
              <path d="M2 8 C40 3, 90 11, 150 6 S250 3, 298 7 L296 11 C240 13, 160 9, 100 12 S30 12, 4 12 Z" fill="#1f8a63" fill-opacity=".85"/>
            </svg>
          </span>
        </div>
      </div>
      <p class="skip-hint">Klik for at springe over</p>
    </div>
  </div>

  <a class="test-label" href="index.html">← Til hjemmesiden · TEST LOGO-INTRO</a>
  <div class="controls">
    <button type="button" class="secondary" id="slow">Langsomt</button>
    <button type="button" id="replay">Afspil igen</button>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var intro = document.getElementById('intro');
      var HOLD = 3300;           // ms før introen forsvinder
      var timer;
      var slow = false;

      // Kun til test: afspil i 1/3 fart, så detaljerne kan ses.
      function applySpeed() {
        if (!document.getAnimations) return;
        document.getAnimations().forEach(function (a) { a.playbackRate = slow ? 1 / 3 : 1; });
      }
      function leave() {
        clearTimeout(timer);
        stage.classList.add('leave');
        applySpeed();
      }
      function play() {
        clearTimeout(timer);
        stage.classList.remove('play', 'leave');
        void stage.offsetWidth;    // genstart CSS-animationerne
        stage.classList.add('play');
        applySpeed();
        timer = setTimeout(leave, HOLD * (slow ? 3 : 1));
      }

      intro.addEventListener('click', leave);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' || e.key === 'Enter') leave(); });
      document.getElementById('replay').addEventListener('click', play);
      document.getElementById('slow').addEventListener('click', function () {
        slow = !slow;
        this.textContent = slow ? 'Normal fart' : 'Langsomt';
        play();
      });

      // Kommer man hertil med pensel-overgangen, venter introen til malingen er væk.
      if (/[?&]wipe=1/.test(location.search)) {
        stage.classList.remove('play');
        setTimeout(play, 750);
      } else {
        play();
      }
    })();
  </script>
  <script src="js/brush.js"></script>
</body>
</html>
